<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Icons, manifest, fonts -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0e7490" />
    <meta name="author" content="Teevexa" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700;800&display=swap" />

    <!--seo:start-->
    <title data-prerender>Teevexa | AI-Native Software Development</title>
    <meta data-prerender name="description" content="Nairobi-based engineering team building custom software, AI agents and production-ready apps for businesses worldwide. Get a tailored quote in 24 hours." />
    <meta data-prerender property="og:type" content="website" />
    <meta data-prerender property="og:site_name" content="Teevexa" />
    <meta data-prerender property="og:title" content="Teevexa | AI-Native Software Development" />
    <meta data-prerender property="og:description" content="Nairobi-based engineering team building custom software, AI agents and production-ready apps for businesses worldwide. Get a tailored quote in 24 hours." />
    <meta data-prerender property="og:image" content="https://www.teevexa.com/og-image.png" />
    <meta data-prerender name="twitter:card" content="summary_large_image" />
    <!--seo:end-->

    <!-- Prevent flash of wrong theme: apply saved preference; default is light -->
    <script>
      (function () {
        var saved = localStorage.getItem("teevexa_theme");
        if (saved === "dark") {
          document.documentElement.classList.add("dark");
        } else {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
